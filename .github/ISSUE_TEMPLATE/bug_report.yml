name: Bug report
description: A skill or script did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste real personal data, library file contents, repository names of private libraries or private paths; describe them instead (for example "the Atlas library").
        Security problems go through the Security tab ("Report a vulnerability"), not here.
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen
      options:
        - Claude Code in a terminal
        - Claude Code desktop app
        - Claude Code on the web or mobile (claude.ai/code)
        - Other agent
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skills version
      description: The "Version:" line in SKILL.md, or the release you installed
      placeholder: "2.3.0"
  - type: textarea
    id: request
    attributes:
      label: What you asked
      description: The request you made, word for word if possible
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The library's _kb.json (optional)
      description: Remove private names and paths first
      render: json
